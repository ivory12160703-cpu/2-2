<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>미니 루틴</title>
<style>
:root{--bg:#f6f7fb;--white:#fff;--ink:#202536;--muted:#7d8495;--line:#e9ebf2;--primary:#6558d3;--soft:#f0efff;--red:#df5b68;--green:#239b72;--shadow:0 8px 28px rgba(35,39,65,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:4}.brand{font-size:18px;font-weight:850;display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:10px;background:var(--primary);color:white;display:grid;place-items:center}.user{display:flex;align-items:center;gap:9px;color:#626a7c;font-weight:700}.avatar{width:30px;height:30px;border-radius:50%;background:#e9e7ff;color:#574bc2;display:grid;place-items:center;font-weight:800}.layout{max-width:1120px;margin:auto;padding:28px 20px;display:grid;grid-template-columns:225px minmax(0,1fr);gap:24px}.side{position:sticky;top:90px;align-self:start}.sidehead,.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.sidehead{font-weight:800;margin-bottom:12px}.projects{display:grid;gap:6px}.project{background:transparent;text-align:left;padding:11px;border-radius:9px;color:#626a7c}.project.active{background:var(--soft);color:var(--primary);font-weight:800}.dot{display:inline-block;width:8px;height:8px;border-radius:3px;background:#aaa3e9;margin-right:9px}.note{margin-top:22px;padding:13px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--muted);font-size:11px;line-height:1.6}main{min-width:0}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}.eyebrow{font-size:10px;letter-spacing:1px;color:var(--primary);font-weight:850;margin-bottom:7px}h1{font-size:26px;letter-spacing:-1px;margin:0 0 7px}.sub{color:var(--muted);margin:0}.btn{padding:10px 13px;border-radius:9px;font-weight:750}.primary{background:var(--primary);color:white}.light{background:#f0f1f6;color:#555d70}.outline{background:white;border:1px solid var(--line);color:#555d70}.danger{background:#fff0f1;color:var(--red)}.small{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px}.stat{padding:15px 17px}.label{color:var(--muted);font-size:12px;font-weight:650}.value{font-size:25px;font-weight:850;margin-top:6px}.panel{margin-bottom:17px;box-shadow:var(--shadow)}.panelhead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.paneltitle{font-weight:850}.panelbody{padding:16px 18px}.track{height:8px;border-radius:99px;background:#f0f1f5;overflow:hidden}.fill{height:100%;background:var(--primary);border-radius:99px}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.person{display:flex;align-items:center;gap:9px}.person .info{flex:1}.tiny{font-size:11px;color:var(--muted);margin-top:5px}.tabs{display:flex;gap:4px}.tab{background:transparent;color:var(--muted);font-weight:750;padding:7px 10px;border-radius:8px}.tab.active{background:var(--soft);color:var(--primary)}.task{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid #f0f1f5}.task:last-child{border-bottom:0}.checks{display:grid;gap:5px;flex:none}.check{display:flex;gap:6px;align-items:center;background:#f5f5f8;padding:4px 7px;border-radius:6px;font-size:11px}.check input{accent-color:var(--primary)}.taskbody{flex:1;min-width:0}.tasktitle{font-weight:750;line-height:1.5;overflow-wrap:anywhere}.done .tasktitle{color:#9aa0ad;text-decoration:line-through}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.pill{background:#f2f3f7;color:#6c7383;border-radius:6px;padding:4px 7px;font-size:10px;font-weight:700}.late{background:#fff0f0;color:var(--red)}.assignee{background:#f1f2f7;color:#626a7c;border-radius:6px;padding:4px 7px;font-size:10px}.actions{display:flex;gap:4px}.icon{background:transparent;color:#8c92a0;padding:5px}.empty{text-align:center;color:var(--muted);padding:32px 12px}.empty b{display:block;color:#596174;margin-bottom:5px}.modalbg{position:fixed;inset:0;background:#171a2a77;z-index:10;display:grid;place-items:center;padding:16px}.modal{width:min(480px,100%);background:white;border-radius:15px;overflow:auto;max-height:90vh}.modalhead,.modalfoot{padding:16px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalfoot{border-bottom:0;border-top:1px solid var(--line);justify-content:flex-end;gap:8px}.modalbody{padding:18px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field textarea{width:100%;padding:10px 11px;border:1px solid #dfe2eb;border-radius:8px;outline:none}.field textarea{min-height:75px;resize:vertical}.checksgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.checksgrid label{background:#f5f5f8;padding:8px;border-radius:7px;font-size:12px}.notice{background:#fff8e9;color:#8e672c;padding:10px 12px;border-radius:8px;font-size:11px;line-height:1.6;margin-top:15px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#272b3a;color:white;padding:11px 16px;border-radius:9px;z-index:30}
@media(max-width:720px){.top{height:60px;padding:0 14px}.layout{display:block;padding:18px 14px}.side{position:static;margin-bottom:18px}.projects{display:flex;overflow:auto}.project{white-space:nowrap;flex:none}.note{display:none}.welcome h1{font-size:22px}.stats{gap:7px}.stat{padding:11px}.value{font-size:21px}.people{grid-template-columns:1fr}.panelhead,.panelbody{padding:13px}.task{padding:13px;gap:8px}.user span:last-child{display:none}}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.welcome{align-items:center}.welcome .btn{font-size:11px;padding:9px}.task{font-size:12px}}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="logo">✓</span> 미니 루틴</div><div class="user"><span class="avatar" id="myAvatar">나</span><span id="myName">사용자</span><button class="btn light small" id="logout">나가기</button></div></header>
<div class="layout">
<aside class="side"><div class="sidehead"><span>내 프로젝트</span><button class="btn primary small" id="newProject">＋ 생성</button></div><div class="projects" id="projects"></div><div class="note">공유 링크에는 프로젝트 데이터가 함께 포함됩니다. 다른 기기에서 접속하려면 이 HTML 파일을 웹에 올린 뒤 링크를 복사해야 합니다.</div></aside>
<main>
<div class="welcome"><div><div class="eyebrow">PROJECT WORKSPACE</div><h1 id="projectTitle">미니 루틴 시작하기</h1><p class="sub" id="projectSub">프로젝트를 만들고 할 일을 관리해 보세요.</p></div><div id="projectActions"></div></div>
<div id="workspace" class="hidden">
<div class="stats"><div class="stat"><div class="label">전체 진행률</div><div class="value" id="pct">—</div><div class="tiny" id="count">할 일 없음</div></div><div class="stat"><div class="label">미완료 할 일</div><div class="value" id="remain">0</div></div><div class="stat"><div class="label">완료된 할 일</div><div class="value" id="complete">0</div></div></div>
<section class="panel"><div class="panelhead"><b class="paneltitle">프로젝트 진행 상황</b><b id="barPct" style="color:var(--primary)">—</b></div><div class="panelbody"><div class="track"><div class="fill" id="bar" style="width:0"></div></div></div></section>
<section class="panel"><div class="panelhead"><b class="paneltitle">담당자별 진행률</b><span class="pill">공동 담당 포함</span></div><div class="panelbody people" id="people"></div></section>
<section class="panel"><div class="panelhead"><b class="paneltitle">할 일 목록</b><div class="tabs"><button class="tab active" data-tab="todo">미완료</button><button class="tab" data-tab="done">완료</button></div></div><div id="tasks"></div><div class="panelhead"><span class="tiny">마감일이 빠른 순서로 표시됩니다.</span><button class="btn primary small" id="addTask">＋ 할 일 추가</button></div></section>
</div></main></div>
<div id="modal"></div><div id="toasts"></div>
<script>
(()=>{
const STORE='miniRoutineShare_v3',SESSION='miniRoutineSession_v3';
let db=read(),me=null,pid=null,tab='todo';
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
function read(){try{return JSON.parse(localStorage.getItem(STORE))||{projects:[]}}catch(e){return{projects:[]}}}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function p(){return db.projects.find(x=>x.id===pid)}
function m(id){return p()?.members.find(x=>x.id===id)}
function owner(){return p()?.owner===me.id}
function done(t){return t.assignees.length>0&&t.assignees.every(id=>t.checks[id])}
function percent(a,b){return b?Math.round(a/b*100):null}
function toast(s){$('toasts').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('toasts').innerHTML='',2300)}
function encode(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decode(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str);return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))))}
function shareURL(){return location.href.split('#')[0]+'#share='+encode(p())}
function currentMember(){if(!me)return;localStorage.setItem(SESSION,JSON.stringify(me))}
function render(){
 $('myName').textContent=me.name;$('myAvatar').textContent=me.name.slice(0,1);renderProjects();
 const pr=p();if(!pr){$('workspace').classList.add('hidden');$('projectTitle').textContent='미니 루틴 시작하기';$('projectSub').textContent='프로젝트를 만들고 할 일을 관리해 보세요.';$('projectActions').innerHTML='';return}
 $('workspace').classList.remove('hidden');$('projectTitle').textContent=pr.name;$('projectSub').textContent=`생성자 ${esc(m(pr.owner)?.name||'팀원')} · 팀원 ${pr.members.length}명`;
 $('projectActions').innerHTML=`<button class="btn outline small" id="share">↗ 공유 링크</button>${owner()?'<button class="btn light small" id="rename">이름 수정</button>':''}`;
 $('share').onclick=copyShare;if(owner())$('rename').onclick=()=>projectModal(true);
 const finished=pr.tasks.filter(done).length,total=pr.tasks.length,n=percent(finished,total),todo=pr.tasks.filter(t=>!done(t));
 $('pct').textContent=n===null?'—':n+'%';$('count').textContent=`${finished} / ${total}개 완료`;$('remain').textContent=todo.length;$('complete').textContent=finished;$('barPct').textContent=n===null?'—':n+'%';$('bar').style.width=(n||0)+'%';
 renderPeople();renderTasks();
}
function renderProjects(){$('projects').innerHTML=db.projects.filter(x=>x.members.some(v=>v.id===me.id)).map(x=>`<button class="project ${x.id===pid?'active':''}" data-id="${x.id}"><span class="dot"></span>${esc(x.name)}</button>`).join('')||'<span class="tiny">아직 프로젝트가 없습니다.</span>';$('projects').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{pid=b.dataset.id;tab='todo';render()})}
function renderPeople(){const pr=p();const rows=pr.members.map(x=>{const a=pr.tasks.filter(t=>t.assignees.includes(x.id)),c=a.filter(t=>t.checks[x.id]).length;return {name:x.name,id:x.id,c,total:a.length,n:percent(c,a.length)}});const un=pr.tasks.filter(t=>!t.assignees.length);rows.push({name:'담당자 미지정',id:'',c:0,total:un.length,n:null});$('people').innerHTML=rows.map(x=>`<div class="person"><span class="avatar">${x.id?esc(x.name.slice(0,1)):'—'}</span><div class="info"><div class="headrow"><b>${esc(x.name)}</b><b style="color:var(--primary)">${x.n===null?'—':x.n+'%'}</b></div><div class="track" style="margin-top:6px"><div class="fill" style="width:${x.n||0}%"></div></div><div class="tiny">${x.c} / ${x.total}개 체크</div></div></div>`).join('')}
function renderTasks(){const pr=p();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let list=pr.tasks.filter(t=>tab==='done'?done(t):!done(t));if(tab==='todo')list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));$('tasks').innerHTML=list.length?list.map(t=>taskHTML(t)).join(''):`<div class="empty"><b>${tab==='done'?'완료된 할 일이 아직 없어요.':'모든 할 일을 처리했어요!'}</b>${tab==='todo'?'새로운 할 일을 추가해 보세요.':''}</div>`;
 $('tasks').querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{const t=p().tasks.find(t=>t.id===x.dataset.task);t.checks[x.dataset.check]=x.checked;save();render()});
 $('tasks').querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>taskModal(x.dataset.edit));
 $('tasks').querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{if(confirm('할 일을 삭제할까요?')){p().tasks=p().tasks.filter(t=>t.id!==x.dataset.del);save();render()}});
}
function taskHTML(t){const can=t.assignees.includes(me.id)||owner(),checks=t.assignees.map(id=>`<label class="check"><input type="checkbox" data-task="${t.id}" data-check="${id}" ${t.checks[id]?'checked':''} ${can?'':'disabled'}>${esc(m(id)?.name||'팀원')}</label>`).join('');const late=t.due&&t.due<new Date().toISOString().slice(0,10)&&!done(t);return `<div class="task ${done(t)?'done':''}"><div class="checks">${checks||'<span class="tiny">—</span>'}</div><div class="taskbody"><div class="tasktitle">${esc(t.title)}</div><div class="meta"><span class="pill ${late?'late':''}">${t.due?'마감 '+t.due:'마감일 없음'}${late?' · 기한 초과':''}</span>${t.assignees.map(id=>`<span class="assignee">${esc(m(id)?.name||'팀원')}</span>`).join('')||'<span class="assignee">담당자 미지정</span>'}</div></div><div class="actions">${can?`<button class="icon" data-edit="${t.id}">✎</button>`:''}${owner()?`<button class="icon" data-del="${t.id}">✕</button>`:''}</div></div>`}
function modal(title,body,submit,fn){$('modal').innerHTML=`<div class="modalbg" id="bg"><form class="modal" id="form"><div class="modalhead"><b>${title}</b><button type="button" class="icon" id="x">✕</button></div><div class="modalbody">${body}</div><div class="modalfoot"><button type="button" class="btn light" id="cancel">취소</button><button class="btn primary">${submit}</button></div></form></div>`;$('x').onclick=$('cancel').onclick=()=> $('modal').innerHTML='';$('bg').onclick=e=>{if(e.target.id==='bg')$('modal').innerHTML=''};$('form').onsubmit=e=>{e.preventDefault();fn(new FormData(e.target))}}
function projectModal(edit=false){modal(edit?'프로젝트 이름 수정':'새 프로젝트 만들기','<div class="field"><label>프로젝트 이름</label><input name="name" maxlength="40" required value="'+(edit?esc(p().name):'')+'" placeholder="프로젝트 이름"></div>',edit?'저장':'생성',f=>{const name=f.get('name').trim();if(!name)return;if(edit)p().name=name;else{const member={id:me.id,name:me.name};const pr={id:uid(),name,owner:me.id,members:[member],tasks:[]};db.projects.push(pr);pid=pr.id}save();$('modal').innerHTML='';render()})}
function taskModal(id){const t=id?p().tasks.find(x=>x.id===id):null;const opts=p().members.map(x=>`<label><input type="checkbox" name="assignee" value="${x.id}" ${t?.assignees.includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('');modal(t?'할 일 수정':'할 일 추가',`<div class="field"><label>할 일</label><textarea name="title" required maxlength="180">${t?esc(t.title):''}</textarea></div><div class="field"><label>마감일</label><input type="date" name="due" value="${t?.due||''}"></div><div class="field"><label>담당자 (복수 선택 가능)</label><div class="checksgrid">${opts}</div><div class="tiny">공동 담당 업무는 모든 담당자가 체크해야 완료됩니다.</div></div>`,t?'저장':'추가',f=>{const title=f.get('title').trim(),ass=f.getAll('assignee');if(!title)return;if(t){t.title=title;t.due=f.get('due');t.assignees=ass;Object.keys(t.checks).forEach(k=>{if(!ass.includes(k))delete t.checks[k]});ass.forEach(k=>{if(!(k in t.checks))t.checks[k]=false})}else p().tasks.push({id:uid(),title,due:f.get('due'),assignees:ass,checks:Object.fromEntries(ass.map(k=>[k,false]))});save();$('modal').innerHTML='';render()})}
async function copyShare(){const url=shareURL();if(location.protocol==='file:'){prompt('현재 HTML을 로컬 파일로 열었습니다. file:// 주소는 다른 기기에서 열 수 없습니다. 먼저 HTML 파일을 Vercel 등 웹 호스팅에 올린 뒤, 배포된 https 주소로 접속하여 공유 링크를 복사해 주세요.\\n\\n현재 로컬 주소 기반 링크(다른 기기에서는 작동하지 않음):',url);return}try{await navigator.clipboard.writeText(url);toast('프로젝트 데이터가 포함된 공유 링크를 복사했습니다.')}catch(e){prompt('아래 공유 링크를 복사하세요.',url)}}
function joinByName(pr){const name=prompt('참여할 닉네임을 입력하세요.');if(!name?.trim())return;let found=pr.members.find(x=>x.name.toLowerCase()===name.trim().toLowerCase());if(!found){found={id:uid(),name:name.trim()};pr.members.push(found)}me=found;pid=pr.id;currentMember();save();render()}
function start(){
 const hash=new URLSearchParams(location.hash.slice(1)),share=hash.get('share');
 if(share){try{const incoming=decode(share);if(!incoming.id||!Array.isArray(incoming.members)||!Array.isArray(incoming.tasks))throw 0;const ix=db.projects.findIndex(x=>x.id===incoming.id);if(ix>=0)db.projects[ix]=incoming;else db.projects.push(incoming);save();pid=incoming.id;history.replaceState(null,'',location.pathname+location.search+'#project='+encodeURIComponent(pid));joinByName(incoming);return}catch(e){alert('공유 링크의 프로젝트 정보를 읽지 못했습니다.');}}
 const saved=localStorage.getItem(SESSION);if(saved){try{const u=JSON.parse(saved);me=u;const pr=db.projects.find(x=>x.members.some(x=>x.id===me.id));if(pr)pid=pr.id;else me=null}catch(e){}}
 if(!me){const name=prompt('사용할 닉네임을 입력하세요.');if(!name?.trim()){me={id:uid(),name:'사용자'};}else me={id:uid(),name:name.trim()};currentMember()}
 if(!pid){const existing=db.projects.find(x=>x.members.some(m=>m.id===me.id));if(existing)pid=existing.id}
 if(pid)render();else render();
}
$('newProject').onclick=()=>projectModal();$('addTask').onclick=()=>taskModal();$('logout').onclick=()=>{localStorage.removeItem(SESSION);location.reload()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderTasks()});
start();
})();
</script>
</body></html>
